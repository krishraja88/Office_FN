
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="p-lg-4">
    <div class="form-group m-3">
        <label for="exampleFormControlTextarea1">Input</label>
        <textarea class="form-control input" id="exampleFormControlTextarea1" rows="3"></textarea>
    </div>

    <button type="button" class="btn btn-primary">Brackets Remover</button>

    <button type="button" class="btn btn-success">BR + 1 SR</button>

    <button type="button" class="btn btn-warning">BR + 1 SR + FQ Req</button>

    <button type="button" class="btn btn-light" id="btn-FQ-Req">FQ Req</button>

    <button type="button" class="btn btn-info">FQ to Book Req</button>

    <button type="button" class="btn btn-light" id="btn-Upsell-to-book">Upsell to Book Req</button>

    <button type="button" class="btn btn-danger clear-all">Clear ALL</button>


    <br>
    <hr>
    <div class="form-check mt-2 mb-2">
        <input class="form-check-input" type="checkbox" id="chk-prices-required" value="1">
        <label class="form-check-label" for="chk-prices-required">Prices node required</label>
    </div>
    <hr>
    <button type="button" class="btn btn-secondary" id="btn-json-farequote">JSON search → FQ Req</button>

    

    <br>
    <br>

    <input type="text" class="form-control d-inline-block" id="json-filter-text" placeholder="Filter text (optional: airline code, fare key, etc.)" style="width: 400px; display: inline-block;">

    <br>
    <br>

    <button type="button" class="btn btn-outline-success" id="btn-json-search-to-fq">JSON Search → FQ Req (Nxt)</button>

    <button type="button" class="btn btn-outline-info" id="btn-json-fq-to-book">JSON FQ Resp → Book Req (Nxt)</button>

    <button type="button" class="btn btn-outline-info" id="btn-json-Upsell-to-book">JSON Upsell Resp → Book Req (Nxt)</button>

    <br>
    <hr>

    <div class="form-group">
        <label for="exampleFormControlTextarea2">Output (will be copied automatically)</label>
        <textarea class="form-control output" id="exampleFormControlTextarea2" rows="3"></textarea>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="Json_app.js"></script>
    <!--<script src="app.js"></script>-->
</body>
</html>
